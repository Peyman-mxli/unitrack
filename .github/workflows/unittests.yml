name: UniTrack tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python packages
        run: python -m pip install -r requirements.txt
      - name: Prevent account-photo files from being committed publicly
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          directories = (
              'app/static/uploads/',
              'app/static/img/profiles/',
              'app/routes/static/uploads/',
          )
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          exposed = [name for name in tracked if name.startswith(directories)]
          if exposed:
              raise SystemExit(f'{len(exposed)} uploaded profile images are tracked. Remove them from the Git index.')
          ignores = Path('.gitignore').read_text()
          for folder in directories:
              if folder not in ignores:
                  raise SystemExit(f'Missing photo privacy .gitignore rule: {folder}')
          print('Account upload folders are ignored and none of their files are tracked.')
          PY
      - name: Validate Windows safe updater syntax
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/safe_update.ps1').Path, [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Verify camera JavaScript syntax and QR decoding fallback
        shell: bash
        run: |
          node --check app/static/js/qr-camera.js
          node --check app/static/js/vendor/jsQR.js
          python - <<'PY'
          import qrcode
          from PIL import Image
          image = qrcode.make("unitrack-camera-decoder-test").convert("RGBA")
          image = image.resize((400, 400), Image.Resampling.NEAREST)
          with open("/tmp/unitrack-test-qr.rgba", "wb") as stream:
              stream.write(image.tobytes())
          PY
          node - <<'JS'
          const fs = require("node:fs");
          const jsQR = require("./app/static/js/vendor/jsQR.js");
          const pixels = fs.readFileSync("/tmp/unitrack-test-qr.rgba");
          const decoded = jsQR(new Uint8ClampedArray(pixels), 400, 400, {
            inversionAttempts: "attemptBoth"
          });
          if (!decoded || decoded.data !== "unitrack-camera-decoder-test") {
            throw new Error("Bundled jsQR failed to decode a real QR image");
          }
          const corners = decoded.location && [
            decoded.location.topLeftCorner, decoded.location.topRightCorner,
            decoded.location.bottomRightCorner, decoded.location.bottomLeftCorner
          ];
          if (!corners || corners.some(p => !Number.isFinite(p.x) ||
              !Number.isFinite(p.y) || p.x < 0 || p.y < 0 ||
              p.x > 400 || p.y > 400)) {
            throw new Error("jsQR did not return four usable QR bounding corners");
          }
          const minX = Math.min(...corners.map(p => p.x));
          const maxX = Math.max(...corners.map(p => p.x));
          const minY = Math.min(...corners.map(p => p.y));
          const maxY = Math.max(...corners.map(p => p.y));
          if (maxX - minX < 30 || maxY - minY < 30) {
            throw new Error("Invalid QR outline dimensions");
          }
          console.log("Local jsQR decoded a QR and its four bounding corners");
          JS
      - name: Run isolated integration tests
        env:
          FLASK_DEBUG: "False"
        run: python -m unittest discover -s tests -v

  windows-updater:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Exercise updater with Windows PowerShell 5.1 against a temporary database
        shell: powershell
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw "Could not create test venv" }
          & .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Could not install packages" }
          $createDb = Join-Path $env:TEMP 'unitrack-ci-createdb.py'
          [System.IO.File]::WriteAllText($createDb, 'import sqlite3; c = sqlite3.connect("unitrack.db"); c.execute("CREATE TABLE safety_test (id INTEGER PRIMARY KEY)"); c.execute("INSERT INTO safety_test VALUES (1)"); c.commit(); c.close()', (New-Object System.Text.UTF8Encoding($false)))
          & .\.venv\Scripts\python.exe $createDb
          if ($LASTEXITCODE -ne 0) { throw "Could not create isolated test DB" }
          git switch -C main
          if ($LASTEXITCODE -ne 0) { throw "Could not create test branch" }
          & powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\safe_update.ps1 -SkipStart
          if ($LASTEXITCODE -ne 0) { throw "The real Windows PowerShell updater failed" }
          $backups = @(Get-ChildItem -Path .\backups\unitrack-before-update-*.db -ErrorAction Stop)
          if ($backups.Count -lt 1) { throw "The updater did not save the SQLite backup" }
          $verify = Join-Path $env:TEMP 'unitrack-ci-verifydb.py'
          [System.IO.File]::WriteAllText($verify, 'import sqlite3; assert sqlite3.connect("unitrack.db").execute("SELECT COUNT(*) FROM safety_test").fetchone()[0] == 1', (New-Object System.Text.UTF8Encoding($false)))
          & .\.venv\Scripts\python.exe $verify
          if ($LASTEXITCODE -ne 0) { throw "The updater changed the original test database" }
